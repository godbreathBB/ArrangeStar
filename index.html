<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#141a2e">
  <title data-i18n="app.title">星垣 · 紫微斗数 / 八字 / 奇门遁甲</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>

<!-- ═══ 首次启动引导（4 页 · 奇门主题 · 原生 JS 控制）═══ -->
<div id="onboarding" class="ob-root onboarding-hidden" role="dialog" aria-modal="true" aria-label="首次引导">
  <div class="ob-sky" aria-hidden="true">
    <i class="ob-sky-star" style="--x:8%;--y:14%;--d:0s"></i>
    <i class="ob-sky-star" style="--x:22%;--y:62%;--d:.7s"></i>
    <i class="ob-sky-star" style="--x:46%;--y:9%;--d:1.4s"></i>
    <i class="ob-sky-star" style="--x:71%;--y:48%;--d:.3s"></i>
    <i class="ob-sky-star" style="--x:88%;--y:20%;--d:1.1s"></i>
    <i class="ob-sky-star" style="--x:63%;--y:83%;--d:1.8s"></i>
    <i class="ob-sky-star" style="--x:34%;--y:38%;--d:.9s"></i>
  </div>

  <div class="ob-viewport">
    <div class="ob-track" id="obTrack">

      <!-- 页 1 · 八卦旋转 -->
      <section class="ob-slide" data-index="0">
        <div class="ob-art">
          <svg class="bagua-svg" viewBox="0 0 220 220" aria-hidden="true">
            <circle cx="110" cy="110" r="100" class="bg-ring-outer"/>
            <circle cx="110" cy="110" r="82" class="bg-ring-inner"/>
            <g class="bg-spin">
              <text x="110" y="37"  class="bg-glyph">☰</text>
              <text x="162" y="58"  class="bg-glyph">☱</text>
              <text x="183" y="110" class="bg-glyph">☲</text>
              <text x="162" y="162" class="bg-glyph">☳</text>
              <text x="110" y="183" class="bg-glyph">☴</text>
              <text x="58"  y="162" class="bg-glyph">☵</text>
              <text x="37"  y="110" class="bg-glyph">☶</text>
              <text x="58"  y="58"  class="bg-glyph">☷</text>
              <circle cx="110" cy="110" r="40" class="bg-taiji-bg"/>
              <path d="M110 70 A40 40 0 0 1 110 150 A20 20 0 0 1 110 110 A20 20 0 0 0 110 70 Z" class="bg-taiji-yang"/>
              <circle cx="110" cy="90"  r="6" class="bg-eye-light"/>
              <circle cx="110" cy="130" r="6" class="bg-eye-dark"/>
            </g>
          </svg>
        </div>
        <h2 class="ob-title" data-zh="欢迎使用星垣" data-en="Welcome to Xingyuan">欢迎使用星垣</h2>
        <p class="ob-desc" data-zh="古法奇门遁甲排盘工具，助你洞察天时地利" data-en="An ancient Qi Men Dun Jia charting tool to help you read timing and terrain.">古法奇门遁甲排盘工具，助你洞察天时地利</p>
      </section>

      <!-- 页 2 · 九宫逐格亮起（洛书排布，--i 为宫序 1→9） -->
      <section class="ob-slide" data-index="1">
        <div class="ob-art">
          <div class="ob-jiugong">
            <div class="ob-gong" style="--i:3"><b>巽</b><small>四</small></div>
            <div class="ob-gong" style="--i:8"><b>离</b><small>九</small></div>
            <div class="ob-gong" style="--i:1"><b>坤</b><small>二</small></div>
            <div class="ob-gong" style="--i:2"><b>震</b><small>三</small></div>
            <div class="ob-gong" style="--i:4"><b>中</b><small>五</small></div>
            <div class="ob-gong" style="--i:6"><b>兑</b><small>七</small></div>
            <div class="ob-gong" style="--i:7"><b>艮</b><small>八</small></div>
            <div class="ob-gong" style="--i:0"><b>坎</b><small>一</small></div>
            <div class="ob-gong" style="--i:5"><b>乾</b><small>六</small></div>
          </div>
        </div>
        <h2 class="ob-title" data-zh="一键排盘" data-en="One-Tap Charting">一键排盘</h2>
        <p class="ob-desc" data-zh="输入时间即可生成奇门遁甲时局，展示九宫、八门、九星" data-en="Enter a birth time to generate a Qi Men chart with nine palaces, eight gates and nine stars.">输入时间即可生成奇门遁甲时局，展示九宫、八门、九星</p>
      </section>

      <!-- 页 3 · 竹简文字浮现 -->
      <section class="ob-slide" data-index="2">
        <div class="ob-art">
          <div class="ob-bamboo">
            <div class="ob-strip" style="--i:0"><span>古</span><span>诀</span><span>断</span><span>辞</span></div>
            <div class="ob-strip" style="--i:1"><span>格</span><span>局</span><span>吉</span><span>凶</span></div>
            <div class="ob-strip" style="--i:2"><span>主</span><span>客</span><span>进</span><span>退</span></div>
          </div>
        </div>
        <h2 class="ob-title" data-zh="智能断辞" data-en="Guided Readings">智能断辞</h2>
        <p class="ob-desc" data-zh="内置古诀断辞，自动分析格局吉凶，主客进退一目了然" data-en="Built-in classical readings analyze each pattern, so you know when to advance or yield.">内置古诀断辞，自动分析格局吉凶，主客进退一目了然</p>
      </section>

      <!-- 页 4 · 卷轴展开 + 书签 -->
      <section class="ob-slide" data-index="3">
        <div class="ob-art">
          <div class="ob-scroll-wrap">
            <div class="ob-scroll-rod ob-rod-left"></div>
            <div class="ob-scroll-paper">
              <svg class="ob-bookmark" viewBox="0 0 24 32" aria-hidden="true"><path d="M4 2 H20 V30 L12 24 L4 30 Z"/></svg>
              <div class="ob-scroll-lines"><i></i><i></i><i></i></div>
            </div>
            <div class="ob-scroll-rod ob-rod-right"></div>
          </div>
        </div>
        <h2 class="ob-title" data-zh="档案留存" data-en="Local Archive">档案留存</h2>
        <p class="ob-desc" data-zh="排盘结果保存至本地，随时回溯，离线亦可查阅" data-en="Charts are saved on this device — revisit them anytime, even offline.">排盘结果保存至本地，随时回溯，离线亦可查阅</p>
      </section>

    </div>
  </div>

  <div class="ob-dots" id="obDots" aria-hidden="true"></div>
  <div class="ob-footer">
    <button type="button" class="ob-skip" id="obSkip" data-zh="跳过" data-en="Skip">跳过</button>
    <button type="button" class="ob-next" id="obNext" data-zh="下一步" data-en="Next">下一步</button>
  </div>
</div>

<!-- ═══ 主界面（引导期间默认 hidden，结束后由 onboarding.js 移除）═══ -->
<div id="main-content" hidden>
<header>
  <div class="brand"><h1 data-i18n="brand">星 垣</h1></div>
  <div class="hright">
    <nav class="tabs">
      <button class="tab on" data-view="chart" data-i18n="tab.chart">紫微</button>
      <button class="tab" data-view="bazi" data-i18n="tab.bazi">八字</button>
      <button class="tab" data-view="qimen" data-i18n="tab.qimen">奇门</button>
    </nav>
    <button class="vt" id="todayBtn" data-i18n="btn.today" data-i18n-title="title.today" title="今日一句与参考日期">今日</button>
    <button class="vt" id="archiveBtn" data-i18n="btn.archive" data-i18n-title="title.archive" title="本机档案">档案</button>
    <button class="vt" id="settingsBtn" data-i18n="btn.settings" data-i18n-title="title.settings" title="设置">设置</button>
    <button class="vt lang" id="langBtn" data-i18n="lang.switch" data-i18n-title="lang.title" title="Switch to English">EN</button>
  </div>
</header>

<section class="params" id="settingsPanel">
  <p class="db-top" data-i18n="settings.title">本机设置 · 档案只存在这台设备上</p>
  <div class="row">
    <label><span data-i18n="label.refDate">参考日期</span> <input type="date" id="ref"></label>
    <label><span data-i18n="label.dailyDate">今日一句日期</span> <input type="date" id="daily"></label>
    <button class="cbtn" id="clearArchive" data-i18n="btn.clearArchive">清空档案</button>
    <button class="cbtn" id="replayIntro" data-i18n="intro.replay">重看引导</button>
  </div>
  <p class="ratio" data-i18n="settings.ratio">紫微的「大限 / 流年 / 流月 / 流日」按参考日期切换；「今日一句」按当前命盘八字的日干十神与喜忌生成。</p>
</section>

<section class="params" id="archivePanel">
  <p class="db-top"><span data-i18n="archive.title">我的档案</span> <button class="cbtn" id="saveBtn" data-i18n="btn.saveChart">保存当前盘</button></p>
  <div id="archiveBody"></div>
</section>

<div class="wrap">
  <div class="layerbar">
    <div class="vts">
      <button class="vt on" data-layer="benming" data-i18n="layer.benming">本命</button>
      <button class="vt" data-layer="limit" data-i18n="layer.limit">大限</button>
      <button class="vt" data-layer="annual" data-i18n="layer.annual">流年</button>
      <button class="vt" data-layer="month" data-i18n="layer.month">流月</button>
      <button class="vt" data-layer="day" data-i18n="layer.day">流日</button>
    </div>
    <button class="vt" id="linesBtn" data-i18n="btn.hideLines">隐藏连线</button>
  </div>

  <form class="bar birth" id="birthform" onsubmit="return false;">
    <label><span data-i18n="birth.year">年</span> <input id="y" type="number" min="1900" max="2100" step="1" size="4" maxlength="4" inputmode="numeric"></label>
    <label><span data-i18n="birth.month">月</span> <input id="mo" type="number" min="1" max="12" step="1" size="2" maxlength="2" inputmode="numeric"></label>
    <label><span data-i18n="birth.day">日</span> <input id="d" type="number" min="1" max="31" step="1" size="2" maxlength="2" inputmode="numeric"></label>
    <label><span data-i18n="birth.hour">时</span> <input id="hh" type="number" min="0" max="23" step="1" size="2" maxlength="2" inputmode="numeric"></label>
    <label><span data-i18n="birth.minute">分</span> <input id="mi" type="number" min="0" max="59" step="1" size="2" maxlength="2" inputmode="numeric"></label>
    <label><span data-i18n="birth.gender">性别</span> <select id="g">
      <option value="女" data-i18n="birth.female">女</option><option value="男" data-i18n="birth.male">男</option>
    </select></label>
    <label><span data-i18n="birth.lon">经度</span> <input id="lon" type="number" step="0.0001" min="60" max="150" size="8" inputmode="decimal"></label>
    <button type="button" id="go" class="go" data-i18n="btn.chart">排盘</button>
  </form>

  <main id="out" class="out"></main>
</div>

<div id="notepanel" class="notepanel" hidden></div>
<aside id="drawer" role="region" data-i18n-aria="aria.palace" aria-label="宫位解读" tabindex="-1"></aside>
<div id="starmask"></div>
<aside id="starsheet" role="dialog" aria-modal="true" data-i18n-aria="aria.starsheet" aria-label="星曜说明" tabindex="-1" aria-hidden="true" inert></aside>
</div><!-- /#main-content -->

<script src="js/data.js"></script>
<script src="bundle.js"></script>
<script src="js/onboarding.js"></script>
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }</script>
</body>
</html>
